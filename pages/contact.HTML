<section class="contact-hero">
  <div class="container">
    <span class="tag">// CONTACT</span>
    <h1 style="margin:1rem 0 1rem;">Get in touch.</h1>
    <p style="max-width:480px;line-height:1.75;font-size:1rem;">Found a bug? Have a feature request? Reach out directly — there's one developer on the other end.</p>
  </div>
</section>

<section>
  <div class="container">
    <div class="contact-layout">
      <div class="contact-info">
        <h3>// DIRECT LINES</h3>
        <div class="contact-detail">
          <span class="contact-detail-label">Email</span>
          <a href="mailto:hello@sentryeye.dev" class="contact-detail-val">hello@sentryeye.dev</a>
        </div>
      </div>

      <div>
        <span class="tag" style="margin-bottom:1.5rem;display:inline-block;">// SEND A MESSAGE</span>
        <div class="contact-form" id="contact-form">
          <div class="form-group"><label class="form-label">Name</label><input type="text" class="form-input" placeholder="Ada Lovelace" /></div>
          <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-input" placeholder="ada@example.com" /></div>
          <div class="form-group"><label class="form-label">Message</label><textarea class="form-textarea" placeholder="Describe your issue..."></textarea></div>
          <button class="btn btn-primary" type="button">↗&thinsp; Send Message</button>
          <div class="form-success" id="form-success">✓ Message sent safely. You'll receive a reply within 48 hours.</div>
        </div>
      </div>
    </div>
  </div>
</section>
